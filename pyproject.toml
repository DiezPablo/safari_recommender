[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safari"
version = "0.1.0"
description = "Safaris por el mundo: dónde y cuándo ver cada animal y cómo organizarlo, con datos abiertos"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Uso personal, no comercial" }
authors = [{ name = "Pablo Díez" }]
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
safari = "safari.cli:main"

[tool.setuptools.packages.find]
include = ["safari*"]

[tool.setuptools.package-data]
safari = ["recursos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["cache", "node_modules", ".next", "public"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # las líneas largas se dejan al formateador
  "E731",    # lambdas con nombre en código numérico corto
  "RUF001", "RUF002", "RUF003",  # texto en español: comillas «», guiones y signos tipográficos a propósito
  "SIM108",  # el ternario no siempre es más legible
]

[tool.ruff.lint.isort]
known-first-party = ["safari"]

[tool.ruff.format]
quote-style = "double"
