# Safaris: el catálogo curado (safaris.json, 65 parques escritos a mano). Semanal, ~1 h 15 min.
# Todos los parques del mundo van aparte, en safaris_mundo.yml; lo visto en 30 días, en recientes.yml.
name: Safaris

on:
  schedule:
    - cron: "13 3 * * 0" # domingos, lejos de Datos y de Rutas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - safari/cli.py
      - safari/catalogo.py
      - safari/inat.py
      - safari/entorno.py
      - safari/recursos/safaris.csv
      - .github/workflows/safaris.yml

permissions:
  contents: write

concurrency:
  group: safaris
  cancel-in-progress: false

jobs:
  safaris:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - uses: actions/cache/restore@v6
        with:
          path: cache
          key: safaris-cat-v1-${{ github.run_id }}
          restore-keys: |
            safaris-cat-v1-
            safaris-v1-

      # Los 65 parques escritos a mano: especies de iNaturalist, clima ERA5 y alojamientos (~1 h)
      - name: Catálogo
        continue-on-error: true
        run: python -m safari --salida salida/safaris.json

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: cache
          key: safaris-cat-v1-${{ github.run_id }}

      - name: Publicar
        run: |
          [ -s salida/safaris.json ] || { echo "Nada que publicar"; exit 1; }
          .github/scripts/publicar_release.sh "Safaris ($(date -u +%Y-%m-%d))" salida/safaris.json
