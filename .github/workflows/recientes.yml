# Lo que se ha visto en cada parque destacado en los últimos 30 días (iNaturalist): ordena «mejor ahora» y
# cambia con la temporada y la migración. Dos veces al día; si no cambia nada, no se publica ni se despliega.
name: Recientes

on:
  schedule:
    - cron: "41 5 * * *"
    - cron: "41 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-recientes
  cancel-in-progress: false

jobs:
  recientes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Avistamientos de 30 días
        run: python -m safari --recientes --salida salida/safaris_recientes.json
      - name: Publicar
        run: .github/scripts/publicar_release.sh "Recientes $(date -u +%Y-%m-%dT%H:%MZ)" salida/safaris_recientes.json
